[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cpu-recommendation-service"
version = "0.1.0"
description = "CPU-only ranking with chronological evaluation and an offline fixture API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.136.3,<1",
  "pydantic>=2.13.5,<3",
  "numpy>=2.5.3,<3",
  "scipy>=1.18.1,<2",
  "implicit==0.7.3",
  "threadpoolctl>=3.6,<4",
  "typer>=0.27.2,<1",
  "uvicorn>=0.53,<1",
]

[dependency-groups]
dev = ["pytest>=8.4.2,<9", "httpx>=0.28.1,<1", "ruff>=0.16.7,<1", "mypy>=1.20.2,<2"]

[project.scripts]
reco = "reco.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/reco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".uv-cache", ".bootstrap", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["reco"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["scipy.*", "implicit.*", "threadpoolctl"]
ignore_missing_imports = true
