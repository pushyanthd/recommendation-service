name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: make setup
      - run: make check
      - run: make smoke
      - run: .bootstrap/bin/uv audit --locked
      - run: .venv/bin/reco benchmark --fixture --output artifacts/ci-canary
      - run: .venv/bin/reco benchmark --fixture --final --output artifacts/ci-canary
      - run: .venv/bin/reco verify-report artifacts/ci-canary/final
      - run: make distribution-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fictional-fixture-smoke
          path: |
            artifacts/fixture-smoke.json
            artifacts/ci-canary
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/

  cpu-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: make setup
      - run: make image
      - run: make image-check
      - run: make audit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cpu-container-security
          path: |
            artifacts/container/verification.json
            artifacts/image-audit
